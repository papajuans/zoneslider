<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZoneSlider</title>
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body>
    <header>
      <h1>ZoneSlider</h1>
      <p><strong>Drag</strong> the timeline to quickly see what time it is in different cities.</p>
      <p><strong>Hover</strong> over a city to find out how many hours away the other cities are.</p>
      <p>See <a href="https://github.com/papajuans/zoneslider">github</a>.</p>
    </header>

    <div id="controls">
      Format:
      <button data-format="ampm">AM-PM</button>
      <button data-format="mil">24 hour</button>
      |
      <button id="reset">Reset to now</button>
      |
      <button data-hours="24">+1 day</button>
      <button data-hours="-24">-1 day</button>
      <button data-hours="12">+12h</button>
      <button data-hours="-12">-12h</button>
      <button data-hours="8">+8h</button>
      <button data-hours="-8">-8h</button>
      <button data-hours="1">+1h</button>
      <button data-hours="-1">-1h</button>
    </div>

    <div id="search">
      <input id="city-search" type="search" placeholder="Search for a city…" autocomplete="off">
      <ul id="search-results"></ul>
    </div>

    <div id="timeline-container">
      <svg id="zoneslider"></svg>
    </div>

    <script src="app.js"></script>
  </body>
</html>
